<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>就一口 · 表情包</title>
<style>
  :root { --line: rgba(255,255,255,.10); --t2: rgba(235,235,245,.60); --t3: rgba(235,235,245,.34); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:#000; color:#fff; min-height:100vh; max-width:560px; margin:0 auto;
    padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 40px);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(10,132,255,.22), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(191,90,242,.16), transparent 45%),
      radial-gradient(circle at 50% 110%, rgba(48,209,88,.14), transparent 50%);
  }
  header, main { position:relative; z-index:1; }
  header { padding:34px 2px 18px; }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.02em; }
  .sub { font-size:13px; color:var(--t2); margin-top:4px; }
  .hint {
    font-size:13px; line-height:1.6; color:var(--t2);
    background:rgba(28,28,30,.66); border:.5px solid var(--line);
    border-radius:16px; padding:14px 16px; margin:16px 0 22px;
    backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
  }
  .hint b { color:#fff; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  figure {
    background:rgba(28,28,30,.66); border:.5px solid var(--line); border-radius:20px;
    padding:10px; margin:0; backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
  }
  figure img { width:100%; height:auto; display:block; border-radius:14px; }
  figcaption { font-size:12px; color:var(--t2); padding:8px 2px 2px; text-align:center; }
  .sec { font-size:13px; font-weight:600; color:var(--t2); letter-spacing:.06em;
         text-transform:uppercase; margin:30px 2px 12px; }
  .banner { width:100%; height:auto; border-radius:18px; display:block;
            border:.5px solid var(--line); }
  .wide { grid-template-columns:1fr; }
  footer { font-size:12px; color:var(--t3); margin-top:30px; line-height:1.7; }
  a { color:#0a84ff; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>就一口</h1>
  <div class="sub">没吃多少 · 表情包 · 一套 8 张</div>
</header>

<main>
  <div class="hint">
    <b>手机上长按任意一张，选「保存图片」</b>即可存进相册。<br>
    电脑上右键另存为。整套打包在 <a href="https://github.com/iorlchotae/not-that-much">GitHub 仓库</a> 的 <code>stickers/</code> 里。
  </div>

  <div class="sec">表情 01–08</div>
  <div class="grid" id="grid"></div>

  <div class="sec">横版图</div>
  <div class="grid wide">
    <figure>
      <img src="banner@2x.png" alt="吃得再多 也要装作没吃多少">
      <figcaption>吃得再多，也要装作没吃多少</figcaption>
    </figure>
  </div>

  <footer>
    角色「就一口」——一只对自己的食量毫无正确认知的橘猫。<br>
    名字的意思是：这是每个减肥的人都会说的那句谎。<br>
    App 在 <a href="../">这里</a>。
  </footer>
</main>

<script>
  const CAP = ['还很宽裕～','一切正常','就一口','额度见底','今日份自律','不怪食物，怪我嘴','建议直接报警','今天还一口没动'];
  const ZH  = ['得意','满足','馋','心虚','害羞','委屈','震惊','睡觉'];
  document.getElementById('grid').innerHTML = CAP.map((c, i) => {
    const n = String(i + 1).padStart(2, '0');
    return `<figure><img src="caption/${n}.png" alt="${ZH[i]}：${c}" loading="lazy">
            <figcaption>${n} ${ZH[i]} · ${c}</figcaption></figure>`;
  }).join('');
</script>
</body>
</html>
