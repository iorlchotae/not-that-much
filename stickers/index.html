<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>就一口 · 表情包 24 张</title>
<style>
  :root { --line: rgba(255,255,255,.10); --t2: rgba(235,235,245,.60); --t3: rgba(235,235,245,.34); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:#000; color:#fff; min-height:100vh; max-width:560px; margin:0 auto;
    padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 40px);
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(10,132,255,.22), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(191,90,242,.16), transparent 45%),
      radial-gradient(circle at 50% 110%, rgba(48,209,88,.14), transparent 50%);
  }
  header, main { position:relative; z-index:1; }
  header { padding:34px 2px 18px; }
  h1 { font-size:32px; font-weight:700; letter-spacing:-.02em; }
  .sub { font-size:13px; color:var(--t2); margin-top:4px; }
  .hint {
    font-size:13px; line-height:1.6; color:var(--t2);
    background:rgba(28,28,30,.66); border:.5px solid var(--line);
    border-radius:16px; padding:14px 16px; margin:16px 0 22px;
    backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
  }
  .hint b { color:#fff; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  figure {
    background:rgba(28,28,30,.66); border:.5px solid var(--line); border-radius:16px;
    padding:6px; margin:0; backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
  }
  figure img { width:100%; height:auto; display:block; border-radius:11px; }
  figcaption { font-size:10px; color:var(--t2); padding:5px 1px 1px; text-align:center; line-height:1.3; }
  .sec { font-size:13px; font-weight:600; color:var(--t2); letter-spacing:.06em;
         text-transform:uppercase; margin:30px 2px 12px; }
  .banner { width:100%; height:auto; border-radius:18px; display:block;
            border:.5px solid var(--line); }
  footer { font-size:12px; color:var(--t3); margin-top:30px; line-height:1.7; }
  a { color:#0a84ff; text-decoration:none; }
</style>
</head>
<body>
<header>
  <h1>就一口</h1>
  <div class="sub">没吃多少 · 表情包 · 一套 24 张</div>
</header>
<main>
  <div class="hint">
    <b>手机上长按任意一张，选「保存图片」</b>即可存进相册。<br>
    整套打包在 <a href="https://github.com/iorlchotae/not-that-much">GitHub 仓库</a> 的 <code>stickers/</code>（含 240×240 无文字版）。
  </div>

  <div class="sec">表情 01–24</div>
  <div class="grid">
    <figure><img src="caption/01.png" alt="震惊：建议直接报警" loading="lazy"><figcaption>01 震惊</figcaption></figure>
    <figure><img src="caption/02.png" alt="爱了：这一口真值" loading="lazy"><figcaption>02 爱了</figcaption></figure>
    <figure><img src="caption/03.png" alt="平静：一切正常" loading="lazy"><figcaption>03 平静</figcaption></figure>
    <figure><img src="caption/04.png" alt="心虚：额度见底" loading="lazy"><figcaption>04 心虚</figcaption></figure>
    <figure><img src="caption/05.png" alt="装酷：减肥这事我很在行" loading="lazy"><figcaption>05 装酷</figcaption></figure>
    <figure><img src="caption/06.png" alt="拜拜：明天一定" loading="lazy"><figcaption>06 拜拜</figcaption></figure>
    <figure><img src="caption/07.png" alt="生气：谁动了我的额度" loading="lazy"><figcaption>07 生气</figcaption></figure>
    <figure><img src="caption/08.png" alt="馋：就一口" loading="lazy"><figcaption>08 馋</figcaption></figure>
    <figure><img src="caption/09.png" alt="睡觉：今天还一口没动" loading="lazy"><figcaption>09 睡觉</figcaption></figure>
    <figure><img src="caption/10.png" alt="吃惊：这也能算热量？" loading="lazy"><figcaption>10 吃惊</figcaption></figure>
    <figure><img src="caption/11.png" alt="疑惑：这个有多少卡" loading="lazy"><figcaption>11 疑惑</figcaption></figure>
    <figure><img src="caption/12.png" alt="委屈：我真的没吃多少" loading="lazy"><figcaption>12 委屈</figcaption></figure>
    <figure><img src="caption/13.png" alt="干饭：补充能量而已" loading="lazy"><figcaption>13 干饭</figcaption></figure>
    <figure><img src="caption/14.png" alt="害羞：今天真的没吃多少" loading="lazy"><figcaption>14 害羞</figcaption></figure>
    <figure><img src="caption/15.png" alt="期待：下一顿吃什么" loading="lazy"><figcaption>15 期待</figcaption></figure>
    <figure><img src="caption/16.png" alt="得意：还很宽裕～" loading="lazy"><figcaption>16 得意</figcaption></figure>
    <figure><img src="caption/17.png" alt="馋嘴：最后一口" loading="lazy"><figcaption>17 馋嘴</figcaption></figure>
    <figure><img src="caption/18.png" alt="紧张：就一点，真的" loading="lazy"><figcaption>18 紧张</figcaption></figure>
    <figure><img src="caption/19.png" alt="背对：听不见听不见" loading="lazy"><figcaption>19 背对</figcaption></figure>
    <figure><img src="caption/20.png" alt="偷看：我就瞄一眼" loading="lazy"><figcaption>20 偷看</figcaption></figure>
    <figure><img src="caption/21.png" alt="不高兴：不能浪费" loading="lazy"><figcaption>21 不高兴</figcaption></figure>
    <figure><img src="caption/22.png" alt="打盹：吃撑了，动不了" loading="lazy"><figcaption>22 打盹</figcaption></figure>
    <figure><img src="caption/23.png" alt="愣住：今天到此为止" loading="lazy"><figcaption>23 愣住</figcaption></figure>
    <figure><img src="caption/24.png" alt="抱抱：吃饱了才有力气减" loading="lazy"><figcaption>24 抱抱</figcaption></figure>
  </div>

  <div class="sec">横版图</div>
  <img class="banner" src="banner@2x.png" alt="吃得再多 也要装作没吃多少">

  <footer>
    角色「就一口」——一只对自己的食量毫无正确认知的小猫。<br>
    名字的意思是：这是每个减肥的人都会说的那句谎。<br>
    App 在 <a href="../">这里</a>。
  </footer>
</main>
</body>
</html>
